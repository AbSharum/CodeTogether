<!DOCTYPE html>
<html lang="en">
        <head>
            <title>Code Together Account Creation</title>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" href="fancy.css"> 
            <link rel = "stylesheet" href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        </head>
        <body class = "bg-dark text-light">
            <canvas id="matrix-canvas"></canvas>
            <div class="container d-flex align-items-center justify-content-center vh-100 position-relative" style="z-index: 1;">
                <div class="card p-4 text-bg-dark bg-opacity 75" style="max-width: 400px;">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Code Together Account Creation</h2>
                        <form action = "createAccount.php" method="POST"> 
                            <form id="registration"> 
                            <div class="mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" name="firstName" required>
                            </div>
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" name="lastName" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                    <input type="text" class="form-control" id="email" name="email" aria-describedby="emailHelp" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="text" class="form-control" id="password" name="password" required>
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="text" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-success">Create Account</button>
                            </div>
                            </form>
                            <div class="d-grid gap-2">
                                <button type="return" class="btn btn-success" onclick="window.location.href='fancyLogin.html'">Return to Login</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        <script src="fancyLogin.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

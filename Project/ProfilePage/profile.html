<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #f5f7fa, #c3cfe2);
      margin: 0;
      padding: 0;
      display: flex;
    }
    .main {
      flex: 2;
      padding: 20px;
    }
    .profile-card {
      flex: 1;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      margin: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .profile-card img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .post {
      background: #fff;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }
    .assistant {
      position: fixed;
      bottom: 10px;
      right: 10px;
      display: flex;
      align-items: flex-end;
    }
    .speech {
      background: #fff8dc;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 10px;
      margin-right: 10px;
      max-width: 200px;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .speech.show {
      opacity: 1;
    }
    .assistant img {
      width: 120px;
    }

    #maid {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 120px;
        cursor: pointer;
        z-index: 100;
    }

    #speech {
        position: fixed;
        max-width: 250px;
        padding: 10px 15px;
        background: #fff8c6;
        border: 2px solid #f1d600;
        border-radius: 15px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        opacity: 0;
        transition: opacity 0.6s, bottom 0.3s, right 0.3s;
        z-index: 101;
        word-wrap: break-word;
    }

    /* Arrow pointing toward mascot */
    #speech::after {
        content: '';
        position: absolute;
        bottom: -15px;
        width: 0; 
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 10px solid #fff8c6;
        right: 20px; /* dynamic JS will adjust */
        transform-origin: center bottom;
    }

    /* Bounce animation for arrow */
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }

    #maidForm {
        position: fixed;
        bottom: 100px;
        right: 160px;
        z-index: 100;
        display: flex;
    }

    #maidForm input {
        padding: 5px 10px;
        flex: 1;
    }

    #maidForm button {
        margin-left: 5px;
        padding: 5px 10px;
    }
  </style>
</head>
<body>
  <div class="main">

    <div>
      <img src="https://via.placeholder.com/80" style="border-radius:50%">
      <button onclick="window.location='home.php'">Go to Home</button>
    </div>


    <h2>Posts</h2>
    <form id="postForm">
      <textarea name="newPost" id="newPost" rows="3" placeholder="What's on your mind?"></textarea><br>
      <button type="submit">Post</button>
    </form>
    <div id="posts"></div>
  </div>

  <div class="profile-card">
    <img id="profilePic" src="default.png" alt="Profile Picture">
    <form id="picForm" enctype="multipart/form-data">
      <input type="file" name="profilePic" id="profilePicInput"><br>
      <button type="submit">Change Picture</button>
    </form>

    <h3 id="fullname"></h3>
    <p id="username"></p>
    <textarea id="bio" rows="3"></textarea><br>
    <button id="saveBio">Save Bio</button>

    <p><strong>Location:</strong> <span id="location"></span></p>
    <p><strong>Joined:</strong> <span id="joined"></span></p>
    <p><strong>Followers:</strong> <span id="followers"></span> | 
       <strong>Following:</strong> <span id="following"></span></p>
  </div>

  <!-- Maid mascot -->
  <img src="maid.webp" id="maid" style="position: fixed; bottom: 20px; right: 20px; width: 120px; cursor: pointer; z-index: 100;">

  <!-- Speech bubble -->
  <div id="speech" style="
      position: fixed;
      bottom: 150px;
      right: 20px;
      max-width: 250px;
      padding: 10px 15px;
      background: #fff8c6;
      border: 2px solid #f1d600;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.6s;
      z-index: 101;
  ">
  </div>

  <!-- Maid chat input -->
  <form id="maidForm" style="position: fixed; bottom: 120px; right: 160px; z-index: 100;">
    <input type="text" id="maidInput" placeholder="Ask the maid..." style="padding: 5px 10px;">
    <button type="submit">Send</button>
  </form>

  

<script>
document.addEventListener('DOMContentLoaded', () => {
  const bubble = document.getElementById('speech');
  const maidForm = document.getElementById('maidForm');
  const maidImg = document.getElementById('maid');
  const maidInput = document.getElementById('maidInput');

  let autoActive = true;
  const fallback = [
      "Don’t forget to hydrate, master~",
      "Your followers crave your wisdom.",
      "Another post could make you famous… or infamous.",
      "Careful, too much scrolling might melt your brain.",
      "I’m just a humble maid, but I think you look cool today."
  ];

  // Dynamically position the bubble above and left of mascot
  function positionBubble() {
      if (!bubble || !maidImg) return;
      const rect = maidImg.getBoundingClientRect();
      bubble.style.bottom = window.innerHeight - rect.top + 20 + 'px';
      bubble.style.right = window.innerWidth - rect.right + 160 + 'px';

      // Adjust arrow to point toward mascot
      bubble.style.setProperty('--arrow-right', '20px');
      const arrow = bubble.querySelector('::after'); // pseudo-element cannot be selected directly
      // We'll trigger CSS animation by adding/removing class instead
  }

  let bubbleTimer = null;

  function showSpeech(text, override=false) {
      if (!bubble) return;
      bubble.textContent = text;
      positionBubble();

      // Trigger bounce animation
      bubble.classList.remove('bounce');
      void bubble.offsetWidth; // force reflow
      bubble.classList.add('bounce');

      bubble.style.opacity = 1;

      // Clear any old timer so it doesn’t overlap
      if (bubbleTimer) {
          clearTimeout(bubbleTimer);
          bubbleTimer = null;
      }

      // Pick duration
      let duration;
      if (override) {
          // Base 6s + 80ms per character, capped at 20s
          duration = Math.min(6000 + text.length * 80, 20000);
          autoActive = false;
      } else {
          duration = 10000; // idle chatter quick
      }

      bubbleTimer = setTimeout(() => {
          bubble.style.opacity = 0;
          if (override) {
              // After fade out, resume idle chatter
              setTimeout(() => autoActive = true, 5000);
          }
      }, duration);
  }



  function cycleMaid() {
      if (autoActive) {
          const line = fallback[Math.floor(Math.random() * fallback.length)];
          showSpeech(line);
      }
  }
  setInterval(cycleMaid, 10000);

  async function askMaid(question) {
      try {
        const res = await fetch('maid.php', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({event:"userChat", question})
        });
        const raw = await res.text();
        console.log("Raw API response:", raw); // <--- add this
        const data = JSON.parse(raw);

        if (data.choices && data.choices[0].message.content) {
            return data.choices[0].message.content.trim();
        } else if (data.reply) {
            return data.reply;
        }
      } catch (err) {
          console.error("Maid API error:", err);
      }
      return "Sorry master, I couldn't reach the library of wisdom.";
  }

  // User submits AI chat
  if (maidForm) {
      maidForm.addEventListener('submit', async e => {
          e.preventDefault();
          const question = maidInput.value.trim();
          if (!question) return;
          showSpeech("Thinking...", true);
          const reply = await askMaid(question);
          showSpeech(reply, true);
          maidInput.value = "";
      });
  }

  // Clicking on maid triggers special line
  if (maidImg) {
      maidImg.addEventListener('click', () => {
          showSpeech("Eek! You clicked me, master!", true);
      });
  }

  // Adjust bubble on resize
  window.addEventListener('resize', positionBubble);

  // Initial position
  positionBubble();

  async function loadProfile() {
    try {
      const res = await fetch('profile.php');
      const data = await res.json();

      const bioElem = document.getElementById('bio');
      if (bioElem && data.bio !== undefined) bioElem.value = data.bio;

      const profilePic = document.getElementById('profilePic');
      if (profilePic && data.profilePic) profilePic.src = data.profilePic;

      const postsDiv = document.getElementById('posts');
      if (postsDiv && Array.isArray(data.posts)) {
        postsDiv.innerHTML = data.posts.slice().reverse()
          .map(p => `<div class="post">${p.time}: ${p.content}</div>`).join('');
      }

      const followersDiv = document.getElementById('followers');
      if (followersDiv && data.followers !== undefined) followersDiv.textContent = data.followers;

      const followingDiv = document.getElementById('following');
      if (followingDiv && data.following !== undefined) followingDiv.textContent = data.following;

    } catch (err) {
      console.error("Error loading profile:", err);
    }
  }


  // Other UI hooks
  const saveBioBtn = document.getElementById('saveBio');
  if (saveBioBtn) {
    saveBioBtn.addEventListener('click', async () => {
      const bioElem = document.getElementById('bio');
      if (!bioElem) return;
      const formData = new FormData();
      formData.append('bio', bioElem.value);
      await fetch('profile.php', {method:'POST', body: formData});
      showSpeech("Bio updated! Very impressive, master~", true);
      loadProfile();
    });
  }

  const picForm = document.getElementById('picForm');
  if (picForm) {
    picForm.addEventListener('submit', async e => {
      e.preventDefault();
      const formData = new FormData(picForm);
      await fetch('profile.php', {method:'POST', body: formData});
      showSpeech("Such a charming picture, master~", true);
      loadProfile();
    });
  }

  const postForm = document.getElementById('postForm');
  if (postForm) {
    postForm.addEventListener('submit', async e => {
      e.preventDefault();
      const newPost = document.getElementById('newPost');
      if (!newPost) return;
      const content = newPost.value.trim();
      if (!content) return;
      const formData = new FormData();
      formData.append('newPost', content);
      await fetch('profile.php', {method:'POST', body: formData});
      newPost.value = '';
      showSpeech("Another post? You're unstoppable!", true);
      loadProfile();
    });
  }


  // Initial load
  loadProfile();

});
</script>












</body>
</html>

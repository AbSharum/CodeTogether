                <h2 class="card-title text-center mb-4">Code Together Account Settings</h2>
                <form action = "index.php?action=createAccount" method="POST" id="registration">  <!--may need to change im not sure how u peeps are running that side-->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="text" class="form-control" id="email" name="email" aria-describedby="emailHelp" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required>
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                        <input type="checkbox" onclick="showPassAndConf()">Show Password<br> 
                    </div>
                    <div class="mb-3">
                        <label for="delete" class="form-label">Delete Account</label>
                        <input type="text" class="form-control" id="delete" name="delete">
                    </div>
